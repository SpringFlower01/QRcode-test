name: Generate QR Code with Logo

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'QRコード化するURL'
        required: true
        type: string
      output_name:
        description: '出力ファイル名（拡張子不要）'
        required: false
        default: 'qrcode'
        type: string

permissions:
  contents: write

jobs:
  build-qr:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install "qrcode[pil]"

      - name: QRコードを生成 (リポジトリ内のロゴを合成)
        run: |
          python -c "
          import os
          import qrcode
          from PIL import Image
          from qrcode.image.svg import SvgPathImage

          url = '${{ inputs.target_url }}'
          name = '${{ inputs.output_name }}'

          # 誤り訂正レベル最高（H）で作成
          qr_png = qrcode.QRCode(
              version=None,
              error_correction=qrcode.constants.ERROR_CORRECT_H,
              box_size=10,
              border=4
          )
          qr_png.add_data(url)
          qr_png.make(fit=True)
          img_png = qr_png.make_image(fill_color='black', back_color='white').convert('RGB')

          # リポジトリ内の logo.png / logo.jpg を探して合成
          logo_path = None
          for candidate in ['logo.png', 'logo.jpg', 'logo.jpeg']:
              if os.path.exists(candidate):
                  logo_path = candidate
                  break

          if logo_path:
              print(f'Found logo file: {logo_path}')
              logo = Image.open(logo_path)
              qr_width, qr_height = img_png.size
              logo_max_size = int(qr_width * 0.22)
              logo.thumbnail((logo_max_size, logo_max_size))
              
              pos_x = (qr_width - logo.size[0]) // 2
              pos_y = (qr_height - logo.size[1]) // 2
              
              if logo.mode in ('RGBA', 'LA'):
                  img_png.paste(logo, (pos_x, pos_y), logo)
              else:
                  img_png.paste(logo, (pos_x, pos_y))
              print('Logo merged successfully!')
          else:
              print('No logo file found. Generating standard QR code.')

          img_png.save(f'{name}.png')

          # SVGも出力
          qr_svg = qrcode.QRCode(
              version=None,
              error_correction=qrcode.constants.ERROR_CORRECT_H,
              border=4,
              image_factory=SvgPathImage
          )
          qr_svg.add_data(url)
          qr_svg.make(fit=True)
          img_svg = qr_svg.make_image()
          img_svg.save(f'{name}.svg')
          "

      - name: リポジトリへ自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output_name }}.png" "${{ inputs.output_name }}.svg"
          git commit -m "Generate QR code with local logo" || echo "変更なし"
          git push
